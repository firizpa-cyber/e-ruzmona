name: Deploy iOS (Free Beta)

# Бесплатный аналог TestFlight: сборка неподписанной IPA на облачном Mac
# при каждом пуше в main. Без Apple Developer ($99) — установка на iPhone
# через Sideloadly / Diawi / Firebase App Distribution (см. TESTFLIGHT_INSTRUCTION.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze + tests
        run: |
          flutter analyze
          flutter test

      # Собираем без сертификатов Apple (бесплатно, подпись — позже на ПК).
      # --no-codesign останавливается на .xcarchive (экспорт IPA требует подписи),
      # поэтому unsigned IPA пакуем вручную: Payload/Runner.app -> zip.
      - name: Build Unsigned IPA
        run: flutter build ipa --no-codesign

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found, searching..."
            find build/ios -maxdepth 5 -name "*.app" | head -n 20
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y Runner-unsigned.ipa Payload
          rm -rf Payload
          ls -l

      - name: List IPA
        run: ls -l build/ios/ipa/

      # Вариант Б (работает всегда): IPA лежит в Actions -> Artifacts 14 дней
      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-free
          path: build/ios/ipa/*.ipa
          retention-days: 14

      # Вариант А (опционально): Firebase App Distribution.
      # Включается сам, когда в Secrets заданы GCP_SA_KEY и FIREBASE_IOS_APP_ID.
      - name: Upload to Firebase App Distribution
        if: ${{ env.HAS_FIREBASE == 'true' }}
        env:
          HAS_FIREBASE: ${{ secrets.GCP_SA_KEY != '' && secrets.FIREBASE_IOS_APP_ID != '' }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          npm install -g firebase-tools
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          firebase appdistribution:distribute "$IPA" \
            --app "$FIREBASE_IOS_APP_ID" \
            --groups "testers" \
            --release-notes "E-Ruznoma free beta (unsigned, build $GITHUB_RUN_NUMBER)"

      # Вариант В (опционально): прямая ссылка/QR через Diawi.
      # Включается сам, когда в Secrets задан DIAWI_TOKEN (https://www.diawi.com/api).
      - name: Upload to Diawi
        if: ${{ env.HAS_DIAWI == 'true' }}
        env:
          HAS_DIAWI: ${{ secrets.DIAWI_TOKEN != '' }}
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          curl -s -F "token=$DIAWI_TOKEN" -F "file=@$IPA" https://upload.diawi.com/
